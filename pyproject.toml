[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokheavy"
version = "0.1.0"
description = "Interactive CLI for xAI's multi-agent Grok (Heavy) research workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jared Maxwell" }]
keywords = ["xai", "grok", "grok-heavy", "multi-agent", "cli", "research"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "xai-sdk>=1.8.0,<2",
    "rich>=14.0.0,<15",
]

[project.urls]
Homepage = "https://github.com/ThatRetiredDude/GrokHeavy"
Repository = "https://github.com/ThatRetiredDude/GrokHeavy"
Issues = "https://github.com/ThatRetiredDude/GrokHeavy/issues"

[project.scripts]
grokheavy = "grokheavy:main"

[tool.setuptools]
py-modules = ["grokheavy"]
